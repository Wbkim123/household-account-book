<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://kit.fontawesome.com/7c1d7b2f6f.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="../sidebar/sidebar.css">
        <link rel="stylesheet" href="mainpage.css">
        <link rel="stylesheet" href="searchbar.css">
        <link rel="stylesheet" href="../calendar/calendar.css">
    </head>
    <body class = "light">
        <div id="sidebar-placeholder"></div>
        <div class = "searchbar">
            <i class = "fa-solid fa-magnifying-glass"></i>
            <input type = "text" class = "input">
        </div>

        <div class = "calendar-container">
            <div class = "calendar-toggle-btn" id = "calendar-toggle">
                <span id = "toggle-icon"><</span>
            </div>
            <div class = "calendar">
                <div class = "calendar-header">
                    <span class = "month-picker" id = "month-picker">
                        January
                    </span>
                    <div class = "year-picker">
                        <span class = "year-change" id = "prev-year">&lt;</span>
                        <span id = "year">2025</span>
                        <span class = "year-change" id = "next-year">&gt;</span>
                    </div>
                </div>

                <div class = "calendar-body">
                    <div class = "calendar-week-day">
                        <div>Sun</div>
                        <div>Mon</div>
                        <div>Tue</div>
                        <div>Wed</div>
                        <div>Thu</div>
                        <div>Fri</div>
                        <div>Sat</div>
                    </div>
                    <div class = "calendar-days"></div>
                </div>

                <div class = "month-list"></div>
            </div>
        </div>
        <script src = "../calendar/calendar.js"></script>

        <div class = "content-container">
            <div class = "left-box">
                <h2>My Goals</h2>
                <p>여기에 목표나 하고 싶은 말</p>
            </div>
            <div class = "right-box">
                <h2>Spending graph</h2>
                <p>여기에 소비그래프</p>
            </div>
        </div>
    </body>
</html>

<script>    // 사이드바 적용을 위한 자바스크립트 코드
    document.addEventListener("DOMContentLoaded", function () { // DOM이 로드되면 실행
        const sidebarPlaceholder = document.getElementById("sidebar-placeholder");  // 사이드바를 넣을 div 태그를 가져옴
        const body = document.body;  // body 태그를 가져옴

        fetch("../sidebar/sidebar.html") // 사이드바 html 파일을 가져옴
            .then(response => response.text())  // 가져온 html 파일을 text로 변환
            .then(data => { // 변환된 text를 data로 받아서
                sidebarPlaceholder.innerHTML = data;    // 사이드바를 넣을 div 태그에 사이드바 html을 넣음
            
                const menuIcon = document.getElementById("menuicon");    // 메뉴 아이콘을 가져옴    

                menuIcon.addEventListener("change", function () { // 메뉴 아이콘을 클릭했을 때
                    if (menuIcon.checked) {
                        body.classList.add("sidebar-open");
                    } else {
                        body.classList.remove("sidebar-open");
                    }
                });
            })
            .catch(error => console.error("Error loading sidebar:", error));    // 에러 발생시 콘솔에 에러 출력
    });
</script>
